<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>世界之樹 World Tree — moved</title>
<meta name="robots" content="noindex" />
<script>
(function () {
  // Same path on the new site: /tree-game/<rest> → https://sekai-tree.pages.dev/<rest> (query + hash kept).
  var rest = location.pathname.replace(/^\/tree-game(\/|$)/, '/').replace(/\.html$/, '');
  if (rest === '/index') rest = '/';
  location.replace('https://sekai-tree.pages.dev' + rest + location.search + location.hash);
})();
</script>
<meta http-equiv="refresh" content="2; url=https://sekai-tree.pages.dev/" />
</head>
<body style="font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 18px;color:#243026">
<p>世界之樹已搬到新網址 · World Tree has moved to <a href="https://sekai-tree.pages.dev/">https://sekai-tree.pages.dev/</a></p>
</body>
</html>
