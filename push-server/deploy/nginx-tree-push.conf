# /etc/nginx/sites-available/tree-push — own site, separate from any existing site on the VM.
# certbot --nginx -d 158-101-140-210.sslip.io adds the 443/TLS part to this file.
server {
    listen 80;
    server_name 158-101-140-210.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }
}
