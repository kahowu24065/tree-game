<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8fcbf0" />
    <meta name="description" content="一日一樹：一個跟住真實天氣、每日照顧一棵樹的輕遊戲。" />
    <title>世界之樹</title>
    <style>html.preplant .hud,html.preplant #dev-root,html.preplant .ad-banner{opacity:0;pointer-events:none}</style>
    <script>
      try {
        document.documentElement.classList.add('preplant');
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="./assets/index-DO6SuuAO.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/dist-HTnr3vf7.js">
    <link rel="modulepreload" crossorigin href="./assets/ui-BBZOmSaH.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CY8LgAjH.css">
  </head>
  <body>
    <canvas id="scene" aria-label="今日的樹同天空"></canvas>
    <div id="app" class="hud">
      <div class="left-col">
        <div class="glass weather-card" id="weather-card"></div>
        <div class="glass hatch-card" id="hatch-card" hidden>孵蛋時間：<b>06:00</b></div>
        <div id="note-slot" class="note-slot"></div>
        <aside id="coach" class="glass coach" hidden></aside>
      </div>
      <section class="glass status-card" id="status-card" aria-label="樹木狀態"></section>
      <button type="button" class="rail" id="rail" data-open="milestones" aria-label="高度進度同里程"></button>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <button type="button" class="glass pill view-reset" id="view-reset" data-action="reset-view" hidden aria-label="返回全景"></button>
      <p class="zoom-hint" id="zoom-hint" hidden>雙指縮放／滾輪放大・撳動物跟拍</p>
      <div class="sheet-backdrop" id="sheet-backdrop" data-action="close-sheet"></div>
      <section class="sheet glass" id="sheet" data-state="closed" aria-label="成長日誌">
        <div class="sheet-handle" id="sheet-handle" role="button" tabindex="0" aria-expanded="false" aria-controls="sheet-body">
          <span class="grab"></span>
          <span class="sheet-title" id="sheet-title">成長日誌</span>
        </div>
        <button type="button" class="round sheet-gear" id="gear" data-action="settings" aria-label="設定"></button>
        <div class="sheet-body" id="sheet-body"></div>
      </section>
      <nav class="dock" id="dock" aria-label="主要動作"></nav>
    </div>
    <div class="drawer-backdrop" id="drawer-backdrop" data-action="close-drawer" hidden></div>
    <section class="drawer glass" id="drawer" aria-label="樹木狀態：照顧、圖鑑、里程碑、成就" hidden>
      <div class="drawer-head">
        <span class="grab"></span>
        <button type="button" class="round small" data-action="close-drawer" aria-label="關閉" id="drawer-close"></button>
      </div>
      <div class="panel" id="panel"></div>
    </section>
    <div class="drawer-backdrop" id="wx-backdrop" data-action="close-weather" hidden></div>
    <section class="drawer glass wx-page" id="wx-page" role="dialog" aria-label="天氣概況" hidden>
      <div class="drawer-head">
        <span class="grab"></span>
        <button type="button" class="round small" data-action="close-weather" aria-label="關閉" id="wx-close"></button>
      </div>
      <div class="panel" id="wx-panel"></div>
    </section>
    <aside id="ad-banner" class="ad-banner" aria-label="廣告"><div class="ad-slot">廣告</div></aside>
    <div id="modal" class="modal" hidden></div>
    <div id="dev-root" hidden></div>
  </body>
</html>
