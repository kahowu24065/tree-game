<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3f6b4a" />
    <meta name="description" content="一日一樹：一個跟住真實天氣、每日照顧一棵樹的輕遊戲。" />
    <title>一日一樹</title>
  </head>
  <body>
    <div id="app" class="layout">
      <section class="scene-wrap" id="scene-wrap">
        <canvas id="scene" aria-label="今日的樹同天空"></canvas>
        <header class="top">
          <div class="top-copy">
            <p class="mark">一日一樹</p>
            <h1 id="tree-title">窗前小樹</h1>
          </div>
          <div class="weather-chip" id="weather-chip">睇緊天空…</div>
        </header>
        <div class="scene-foot">
          <p id="scene-caption"></p>
          <p id="scene-meta"></p>
        </div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </section>
      <section class="panel" id="panel" aria-label="照顧同紀錄面板"></section>
    </div>
    <div id="modal" class="modal" hidden></div>
    <div id="debug-root" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
